server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /prototype-share {
        return 301 /prototype-share/;
    }

    location = /prototype-share/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /prototype-share/sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /prototype-share/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /prototype-share/ {
        add_header Cache-Control "no-cache";
        try_files /prototype-share/index.html =404;
    }

    location = /prototype-share/share {
        add_header Cache-Control "no-cache";
        try_files /prototype-share/index.html =404;
    }

    location /prototype-share/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
