[project]
name = "solfeo-omr-prototype"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "mypy>=2.3,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
