name: solfeo-telegram-prototype
services:
  bot:
    build: .
    env_file: .env
    environment:
      SOLFEO_TELEGRAM_PROTOTYPE_DATA_DIR: /data
    volumes:
      - bot_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 660s
    healthcheck:
      test: ["CMD", "python", "bot.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  bot_data:
