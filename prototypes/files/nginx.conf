server {
    listen 8080;
    server_name _;
    server_tokens off;
    gzip off;
    etag off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location = /_protected/sample.m4a {
        internal;
        alias /media/sample.m4a;
        types {}
        default_type audio/mp4;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}
