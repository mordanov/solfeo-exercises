name: Product CI

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - pyproject.toml
      - uv.lock
      - requirements.txt
      - package.json
      - package-lock.json
      - .dockerignore
      - .env.example
      - .pre-commit-config.yaml
      - .github/workflows/ci.yml
      - .github/workflows/publish-product.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - pyproject.toml
      - uv.lock
      - requirements.txt
      - package.json
      - package-lock.json
      - .dockerignore
      - .env.example
      - .pre-commit-config.yaml
      - .github/workflows/ci.yml
      - .github/workflows/publish-product.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
      - run: uv sync --locked --python 3.12
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: uv run --locked pre-commit validate-config .pre-commit-config.yaml
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: solfeo_test
      DATABASE_USER: solfeo
      DATABASE_PASSWORD: ci-disposable-test-password
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: solfeo_test
          POSTGRES_USER: solfeo
          POSTGRES_PASSWORD: ci-disposable-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solfeo -d solfeo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run pytest
      - run: uv run alembic -c backend/alembic.ini upgrade head
      - run: uv run alembic -c backend/alembic.ini current --check-heads
      - run: uv run alembic -c backend/alembic.ini check
      - name: Check the runtime dependency export
        run: uv export --locked --no-dev --no-emit-project --no-header --no-annotate | diff requirements.txt -
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - name: Prepare private local configuration
        run: |
          umask 077
          cp .env.example .env
          printf '\nDATABASE_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
      - run: docker compose --env-file .env -f deploy/compose.yaml up --build --wait
      - run: docker compose --env-file .env -f deploy/compose.yaml run --rm migrate alembic -c backend/alembic.ini current --check-heads
      - name: Verify the public health endpoint
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/health | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          curl --fail --silent http://127.0.0.1:18080/ | grep 'id="root"'
      - name: Check isolated production configuration
        run: uv run --locked pytest deploy/tests -q
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down
