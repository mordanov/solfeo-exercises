[project]
name = "solfeo-exercises"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0.45,<2.1",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "pre-commit>=4.3,<5",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "deploy"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend", "deploy"]
mypy_path = ["backend", "deploy"]
