name: solfeo-dev

x-backend: &backend
  image: solfeo-dev-backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    API_HOST: 0.0.0.0
    API_PORT: 8000
    API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
    API_FORWARDED_ALLOW_IPS: ${API_FORWARDED_ALLOW_IPS:-*}
    AUTH_ALLOWED_ORIGINS: '${AUTH_ALLOWED_ORIGINS:-["http://127.0.0.1:18080","http://localhost:18080"]}'
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-90}
    PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
    LOGIN_USERNAME_LIMIT: ${LOGIN_USERNAME_LIMIT:-5}
    LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-30}
    LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
    DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-solfeo_exercises_bot}
    TELEGRAM_LINK_SECONDS: ${TELEGRAM_LINK_SECONDS:-600}
    TELEGRAM_HEALTH_SECONDS: ${TELEGRAM_HEALTH_SECONDS:-600}
    EMERGENCY_MANAGER_USERNAME: ${EMERGENCY_MANAGER_USERNAME:-}
    EMERGENCY_MANAGER_PASSWORD: ${EMERGENCY_MANAGER_PASSWORD:-}
    EMERGENCY_MANAGER_FIRST_NAME: ${EMERGENCY_MANAGER_FIRST_NAME:-Emergency}
    EMERGENCY_MANAGER_LAST_NAME: ${EMERGENCY_MANAGER_LAST_NAME:-Manager}
    MEDIA_ROOT: /app/media
    IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-20971520}
    AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-52428800}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-74448896}
    IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-40000000}
    AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-1800}
    MEDIA_TIMEOUT_SECONDS: ${MEDIA_TIMEOUT_SECONDS:-120}
    AUDIO_BITRATE_KBPS: ${AUDIO_BITRATE_KBPS:-128}
    FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
    FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
    FILE_BINARY: ${FILE_BINARY:-file}
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_NAME: ${DATABASE_NAME:-solfeo}
    DATABASE_USER: ${DATABASE_USER:-solfeo}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the root .env}
    DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
    DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
    DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
    DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-solfeo}
      POSTGRES_USER: ${DATABASE_USER:-solfeo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    volumes:
      - media_data:/app/media
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  telegram:
    <<: *backend
    command: ["python", "-m", "worker.telegram"]
    environment:
      <<: *backend-environment
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_MAX_FILE_BYTES: ${TELEGRAM_MAX_FILE_BYTES:-20000000}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-25}
      TELEGRAM_HTTP_SECONDS: ${TELEGRAM_HTTP_SECONDS:-15}
      TELEGRAM_DOWNLOAD_SECONDS: ${TELEGRAM_DOWNLOAD_SECONDS:-90}
      TELEGRAM_RETRY_SECONDS: ${TELEGRAM_RETRY_SECONDS:-5}
      TELEGRAM_MAX_ATTEMPTS: ${TELEGRAM_MAX_ATTEMPTS:-3}
      TELEGRAM_HEALTH_FILE: ${TELEGRAM_HEALTH_FILE:-/tmp/telegram-ready}
    volumes:
      - media_data:/app/media
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "worker.telegram", "--health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 35s

  omr:
    <<: *backend
    command: ["python", "-m", "worker.omr"]
    restart: unless-stopped
    mem_limit: ${OMR_MEMORY_MB:-1024}m
    memswap_limit: ${OMR_MEMORY_MB:-1024}m
    cpus: ${OMR_CPUS:-1}
    pids_limit: 128
    environment:
      <<: *backend-environment
      OMR_ENABLED: ${OMR_ENABLED:-true}
      OMR_DETECT_MOVEMENTS: ${OMR_DETECT_MOVEMENTS:-false}
      OMR_FAINT_MEAN_COEFF: ${OMR_FAINT_MEAN_COEFF:-0.9}
      OMR_BINARY: ${OMR_BINARY:-/opt/audiveris/bin/Audiveris}
      OMR_JAVA_HOME: ${OMR_JAVA_HOME:-/opt/java/openjdk}
      OMR_TESSDATA: ${OMR_TESSDATA:-/usr/share/tesseract-ocr/5/tessdata}
      OMR_JAVA_HEAP_MB: ${OMR_JAVA_HEAP_MB:-512}
      OMR_TIMEOUT_SECONDS: ${OMR_TIMEOUT_SECONDS:-300}
      OMR_LEASE_SECONDS: ${OMR_LEASE_SECONDS:-600}
      OMR_POLL_SECONDS: ${OMR_POLL_SECONDS:-2}
      OMR_RETRY_SECONDS: ${OMR_RETRY_SECONDS:-30}
      OMR_MAX_ATTEMPTS: ${OMR_MAX_ATTEMPTS:-3}
      OMR_MAX_XML_BYTES: ${OMR_MAX_XML_BYTES:-5242880}
      OMR_HEALTH_FILE: ${OMR_HEALTH_FILE:-/tmp/omr-ready}
      OMR_HEALTH_SECONDS: ${OMR_HEALTH_SECONDS:-600}
    volumes:
      - media_data:/app/media
    tmpfs: ["/tmp:size=${OMR_TMP_MB:-256}m,mode=1777,exec"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "worker.omr", "--health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    environment:
      LOGIN_NGINX_RATE_PER_SECOND: ${LOGIN_NGINX_RATE_PER_SECOND:-5}
      LOGIN_NGINX_BURST: ${LOGIN_NGINX_BURST:-10}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-74448896}
      MEDIA_TIMEOUT_SECONDS: ${MEDIA_TIMEOUT_SECONDS:-120}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DEFAULT_LANGUAGE: ${VITE_DEFAULT_LANGUAGE:-en}
        VITE_HEALTH_TIMEOUT_MS: ${VITE_HEALTH_TIMEOUT_MS:-5000}
        VITE_UPLOAD_TIMEOUT_MS: ${VITE_UPLOAD_TIMEOUT_MS:-600000}
        VITE_LISTENING_HEARTBEAT_MS: ${VITE_LISTENING_HEARTBEAT_MS:-5000}
        VITE_SPOKEN_CONFIG: ${VITE_SPOKEN_CONFIG:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:8080"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - media_data:/app/media:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  media_data:
