name: solfeo-production

x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

x-database: &database
  DATABASE_HOST: postgres
  DATABASE_PORT: 5432
  DATABASE_NAME: ${DATABASE_NAME:-solfeo}
  DATABASE_USER: ${DATABASE_USER:-solfeo}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set the private application password}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}

x-backend: &backend
  image: ${BACKEND_IMAGE:?Set an immutable backend image reference}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${DATABASE_NAME:-solfeo}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a separate PostgreSQL administrator password}
      DATABASE_USER: ${DATABASE_USER:-solfeo}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set the private application password}
      MIGRATION_DATABASE_USER: ${MIGRATION_DATABASE_USER:-solfeo_migrator}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set a separate migration password}
      PRODUCTION_MIGRATION_SCHEMA: ${PRODUCTION_MIGRATION_SCHEMA:-migrations}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-solfeo.sh
        read_only: true
        bind:
          create_host_path: false
    networks: [database]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      <<: *database
      DATABASE_USER: ${MIGRATION_DATABASE_USER:-solfeo_migrator}
      DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set a separate migration password}
      ALEMBIC_VERSION_SCHEMA: ${PRODUCTION_MIGRATION_SCHEMA:-migrations}
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    environment:
      <<: *database
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_FORWARDED_ALLOW_IPS: ${API_FORWARDED_ALLOW_IPS:-*}
      AUTH_ALLOWED_ORIGINS: '${AUTH_ALLOWED_ORIGINS:-["https://solfeo.miveralta.ru"]}'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-90}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      LOGIN_USERNAME_LIMIT: ${LOGIN_USERNAME_LIMIT:-5}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-30}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      EMERGENCY_MANAGER_USERNAME: ${EMERGENCY_MANAGER_USERNAME:-}
      EMERGENCY_MANAGER_PASSWORD: ${EMERGENCY_MANAGER_PASSWORD:-}
      EMERGENCY_MANAGER_FIRST_NAME: ${EMERGENCY_MANAGER_FIRST_NAME:-Emergency}
      EMERGENCY_MANAGER_LAST_NAME: ${EMERGENCY_MANAGER_LAST_NAME:-Manager}
      MEDIA_ROOT: /app/media
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-20971520}
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-52428800}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-74448896}
      IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-40000000}
      AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-1800}
      MEDIA_TIMEOUT_SECONDS: ${MEDIA_TIMEOUT_SECONDS:-120}
      AUDIO_BITRATE_KBPS: ${AUDIO_BITRATE_KBPS:-128}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      FILE_BINARY: ${FILE_BINARY:-file}
    volumes:
      - media_data:/app/media
    tmpfs: [/tmp]
    networks: [application, database]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    environment:
      LOGIN_NGINX_RATE_PER_SECOND: ${LOGIN_NGINX_RATE_PER_SECOND:-5}
      LOGIN_NGINX_BURST: ${LOGIN_NGINX_BURST:-10}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-74448896}
      MEDIA_TIMEOUT_SECONDS: ${MEDIA_TIMEOUT_SECONDS:-120}
    image: ${FRONTEND_IMAGE:?Set an immutable frontend image reference}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRODUCTION_WEB_PORT:-18090}:8080"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - media_data:/app/media:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  application:
  database:
    internal: true

volumes:
  postgres_data:
  media_data:
