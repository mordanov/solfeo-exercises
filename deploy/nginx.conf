worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format structured escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","event":"HTTP_REQUEST",'
        '"method":"$request_method","status":$status,'
        '"duration_seconds":$request_time,"bytes":$body_bytes_sent}';
    access_log /dev/stdout structured;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only the trusted TLS proxy can reach the external frontend network.
    map $http_x_real_ip $client_ip {
        "" $remote_addr;
        default $http_x_real_ip;
    }
    map $http_x_forwarded_proto $original_scheme {
        default $scheme;
        https https;
    }
    map $original_scheme $transport_security {
        default "";
        https "max-age=31536000";
    }
    limit_req_zone $client_ip zone=login:10m rate=${LOGIN_NGINX_RATE_PER_SECOND}r/s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security $transport_security always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        client_max_body_size ${UPLOAD_MAX_BYTES};
        proxy_read_timeout ${MEDIA_TIMEOUT_SECONDS}s;

        error_page 413 = @upload_too_large;
        location @upload_too_large {
            default_type application/json;
            return 413 '{"error":"FILE_TOO_LARGE"}';
        }

        location /_protected_media/ {
            internal;
            alias /app/media/;
            disable_symlinks on;
            max_ranges 1;
        }

        location /_protected_scores/ {
            internal;
            alias /app/media/scores/;
            disable_symlinks on;
            max_ranges 1;
            default_type application/vnd.recordare.musicxml+xml;
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"RATE_LIMITED"}';
        }

        location = /api/auth/login {
            limit_req zone=login burst=${LOGIN_NGINX_BURST} nodelay;
            limit_req_status 429;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $original_scheme;
        }

        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $original_scheme;
        }

        location ~ ^/manifest-(en|ru|es)\.webmanifest$ {
            types {}
            default_type application/manifest+json;
            try_files $uri =404;
        }

        location ~ ^/(login|settings|manager/users|manager/exercises|manager/journal|manager/telegram|student)/?$ {
            try_files /index.html =404;
        }

        location / {
            error_page 404 =404 @not_found;
            try_files $uri $uri/ =404;
        }

        location @not_found {
            try_files /index.html =500;
        }
    }
}
